[package]
name = "patchcraft"
version = "0.1.0"
edition = "2021"
authors = ["Kreivetech Team <contact@kreivetech.com>"]
description = "Fast, resilient, and surgical code patch parser and atomic applier designed for LLM coding workflows"
license = "MIT"
readme = "README.md"
repository = "https://github.com/kreivetech/patchcraft"
homepage = "https://github.com/kreivetech/patchcraft"
keywords = ["patch", "diff", "llm", "codegen", "fuzzy"]
categories = ["development-tools", "text-processing"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
similar = "2.6"

[dev-dependencies]
tempfile = "3.10"
